<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaigurudev AI Learning</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <header>
      <div class="logo">🤖</div>
      <div>
        <h1>Jaigurudev AI</h1>
        <p>आपका AI Learning Assistant</p>
      </div>
    </header>

    <main id="chat">
      <div class="message bot">
        नमस्ते! 🙏 मैं Jaigurudev AI हूँ।<br>
        पढ़ाई से जुड़ा कोई भी सवाल पूछिए।
      </div>
    </main>

    <div class="input-area">
      <input
        id="message"
        type="text"
        placeholder="अपना सवाल लिखें..."
        autocomplete="off"
      >
      <button id="send">भेजें</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
